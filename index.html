<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UFO DASH - MOD FARM COIN V2</title><style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; }canvas { width: min(100vw, 1100px); aspect-ratio: 1100/620; background: #050505; cursor: pointer; }#statusBox { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 8px 16px; border: 1px solid #00ffcc; border-radius: 8px; z-index: 10; text-align: center; }</style></head><body>

<div id="statusBox">⚡ HACK COIN V2: KHÔNG OBSTACLE - NHIỀU COIN HƠN - CHẠM TRẦN/SÀN LÀ CẠNH NỔ ⚡</div>
<canvas id="game" width="1100" height="620"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 1100; const H = 620; const FLOOR = 550; const CEILING = 0;

let state = "start";
let score = 0;
let coinsCollected = 0;
let best = Number(localStorage.getItem("ufoBest") || 0);
let totalCoins = Number(localStorage.getItem("ufoTotalCoins") || 0);
let camera = 0;

const BASE_SPEED = 7;
const GRAVITY = 0.45; 
const JUMP_FORCE = 9.5;

const ufo = { x: 180, y: 300, vy: 0, r: 18, rot: 0 };
let coins = [];

// TẠO NHIỀU COIN HƠN (DÀY HƠN) & KHÔNG CÓ CHƯỚNG NGẠI VẬT
function generateMap() {
  coins = [];
  // Tạo 2000 đồng xu với khoảng cách rất ngắn (35px) giúp ăn xu liên tục
  for(let i = 0; i < 2000; i++){
    const x = 500 + i * 35;
    // Xu xuất hiện dạng sóng sinh động để người chơi căn nhịp bay
    const y = 250 + Math.sin(i * 0.15) * 180;
    coins.push({ x: x, y: y, r: 11, collected: false });
  }
}

function reset(){
  state = "play";
  score = 0;
  coinsCollected = 0;
  camera = 0;
  ufo.x = 180;
  ufo.y = 300;
  ufo.vy = 0;
  generateMap();
}

function flap(){
  if(state === "start" || state === "dead"){ reset(); return; }
  ufo.vy = -JUMP_FORCE;
}

window.addEventListener("keydown", e => { if(e.code === "Space" || e.code === "ArrowUp") flap(); });
canvas.addEventListener("mousedown", flap);
canvas.addEventListener("touchstart", e => { e.preventDefault(); flap(); }, { passive: false });

function circleCircle(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2; const dy = y1 - y2;
  return (dx * dx + dy * dy < (r1 + r2) * (r1 + r2));
}

function crash(){
  state = "dead";
  best = Math.max(best, score);
  localStorage.setItem("ufoBest", best);
}

function update(){
  if(state !== "play") return;

  camera += BASE_SPEED;
  score = Math.floor(camera / 100) + (coinsCollected * 5);

  ufo.vy += GRAVITY;
  ufo.y += ufo.vy;
  ufo.rot = Math.max(-0.4, Math.min(0.5, ufo.vy * 0.05));

  // BẠN SẼ CHẾT KHI BAY QUÁ CAO (TRẦN) HOẶC RƠI QUÁ THẤP (SÀN)
  if(ufo.y + ufo.r >= FLOOR || ufo.y - ufo.r <= CEILING) {
    crash();
    return;
  }

  // Ăn xu & lưu trực tiếp vào tổng Xu
  for(const c of coins){
    if(c.collected) continue;
    let cx = ufo.x + (c.x - camera);
    if(cx < -50 || cx > W + 50) continue;
    
    if(circleCircle(ufo.x, ufo.y, ufo.r, cx, c.y, c.r)){
      c.collected = true;
      coinsCollected++;
      totalCoins++;
      // Tự động lưu Xu vào LocalStorage gốc của game
      localStorage.setItem("ufoTotalCoins", totalCoins);
    }
  }
}

// Nền đơn giản tối đa để mượt và dễ nhìn dải xu
function drawBackground(){
  ctx.fillStyle = "#09090f";
  ctx.fillRect(0, 0, W, H);
  
  // Sàn & trần cảnh báo đỏ/xanh đơn giản
  ctx.fillStyle = "#151522";
  ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.fillStyle = "#ff3366";
  ctx.fillRect(0, FLOOR, W, 4); // Đường cảnh báo nguy hiểm ở sàn
  ctx.fillRect(0, CEILING, W, 4); // Đường cảnh báo nguy hiểm ở trần
}

function drawCoins(){
  for(const c of coins){
    if(c.collected) continue;
    let cx = ufo.x + (c.x - camera);
    if(cx < -30 || cx > W + 30) continue;

    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.arc(cx, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000";
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", cx, c.y);
  }
}

function drawUfo(){
  ctx.save();
  ctx.translate(ufo.x, ufo.y);
  ctx.rotate(ufo.rot);

  ctx.fillStyle = "#a2e8dd";
  ctx.beginPath();
  ctx.ellipse(0, -4, 11, 7, 0, Math.PI, 0);
  ctx.fill();

  ctx.fillStyle = "#ff0055";
  ctx.beginPath();
  ctx.ellipse(0, 3, 22, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawUI(){
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Điểm: " + score, 20, 35);

  ctx.fillStyle = "#ffd700";
  ctx.font = "bold 20px Arial";
  ctx.fillText("🪙 XU ĂN LƯỢT NÀY: " + coinsCollected, 20, 68);
  ctx.fillText("🪙 TỔNG XU DÙNG CHUNG: " + totalCoins, W - 320, 35);
}

function overlay(){
  if(state === "start"){
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 42px Arial";
    ctx.textAlign = "center";
    ctx.fillText("UFO DASH - FARM COIN V2", W/2, 230);
    
    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.fillText("Đã tăng mật độ Coin dày đặc | Không có chướng ngại vật", W/2, 280);
    ctx.fillStyle = "#ff4466";
    ctx.fillText("⚠️ Chú ý: Va chạm với TRẦN hoặc SÀN sẽ bị CHẾT!", W/2, 315);
    
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 22px Arial";
    ctx.fillText("BẤM SPACE HOẶC CLICK ĐỂ BẮT ĐẦU", W/2, 380);
  }

  if(state === "dead"){
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ff3366";
    ctx.font = "bold 55px Arial";
    ctx.textAlign = "center";
    ctx.fillText("CRASH!", W/2, 230);

    ctx.fillStyle = "#ffffff";
    ctx.font = "20px Arial";
    ctx.fillText("Bạn đã va chạm trần/sàn!", W/2, 275);
    
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 22px Arial";
    ctx.fillText("🪙 Xu kiếm được lượt này: +" + coinsCollected + " (Tổng: " + totalCoins + ")", W/2, 315);
    
    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 22px Arial";
    ctx.fillText("BẤM SPACE HOẶC CLICK ĐỂ CHƠI LẠI", W/2, 380);
  }
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawCoins();
  drawUfo();
  drawUI();
  overlay();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body></html>
